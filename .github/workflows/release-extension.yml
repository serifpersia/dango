name: Attach companion extension to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  extension-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip companion extension
        run: |
          cd dango-extension
          zip -r ../dango-extension.zip firefox chrome

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dango-extension.zip
