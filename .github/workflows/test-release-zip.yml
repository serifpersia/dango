name: Test Release Zip

# Manual packaging check only: builds the app exactly like a release,
# zips it, and boots the zip to prove the release tree works.
# No GitHub Release is created, nothing is published to npm.
# Artifacts are kept 7 days for downloading and local testing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Inject Version Date
        run: |
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.versionDate = new Date().toISOString(); fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development

      - name: Generate Shipped Defaults
        run: node server/scripts/generate-shipped-defaults.cjs
        env:
          G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          GOOGLE_AUTH_WORKER_URL: ${{ secrets.GOOGLE_AUTH_WORKER_URL }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_ROLES_WORKER_URL: ${{ secrets.DISCORD_ROLES_WORKER_URL }}

      - name: Build Application
        # Direct exec calls: `pnpm run build` triggers pnpm's
        # verify-deps-before-run, which re-prunes devDependencies in this
        # runner env (vite/tsc vanish). exec runs the binaries as-is.
        run: |
          pnpm --filter dango-client exec tsc
          pnpm --filter dango-client exec vite build
          pnpm --filter dango-server exec tsc
        env:
          VITE_TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
          VITE_ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}

      - name: Verify build artifacts
        # Fail fast if dist doesn't match src before it ships.
        run: |
          test -f client/dist/index.html || (echo "missing client/dist/index.html" && exit 1)
          test -f server/dist/server.js || (echo "missing server/dist/server.js" && exit 1)
          test -f server/dist/shipped-defaults.js || (echo "missing shipped defaults" && exit 1)
          grep -q "dango-providers" server/dist/shipped-defaults.js || (echo "shipped defaults missing provider URL" && exit 1)
          node --input-type=module -e "await import('./server/dist/shipped-defaults.js'); await import('./server/dist/config.js'); console.log('server entry imports OK')"

      - name: Sync root deps for npm channel
        # Same drift check as the release workflow: root package.json
        # must mirror server deps.
        run: |
          node sync-deps.js
          node -e "const r=require('./package.json').dependencies,s=require('./server/package.json').dependencies;if(JSON.stringify(r)!==JSON.stringify(s)){console.error('root dependencies out of sync with server/package.json — run node sync-deps.js locally and commit');process.exit(1)}console.log('root deps in sync with server')"

      - name: Create Release Archive
        run: |
          mkdir -p release-package/client
          mkdir -p release-package/server
          cp -r client/dist release-package/client/
          cp -r server/dist release-package/server/
          cp client/package.json release-package/client/
          cp server/package.json release-package/server/
          cp package.json LICENSE README.md release-package/
          cp orchestrator.js release-package/

          echo "#!/bin/bash" > release-package/run.sh
          echo "node orchestrator.js prod" >> release-package/run.sh

          echo "@echo off" > release-package/run.bat
          echo "node orchestrator.js prod" >> release-package/run.bat

          chmod +x release-package/run.sh

      - name: Install packaged dependencies
        # Pinned flat tree: pnpm resolves from pnpm-lock (unlike bare npm
        # install, which re-resolves latest-minor with no lockfile) and
        # node-linker=hoisted lays it out flat with zero symlinks, so the
        # zip extracts cleanly on Windows. .bin/.pnpm are install metadata,
        # unneeded at runtime.
        run: |
          pnpm install --prod --frozen-lockfile --config.node-linker=hoisted --modules-dir "$GITHUB_WORKSPACE/release-package/node_modules"
          rm -rf release-package/node_modules/.bin release-package/node_modules/.pnpm
          node -e "for (const p of ['hono','@hono/node-server','@trpc/server','drizzle-orm','youtubei.js','fflate','cheerio','got-scraping','bgutils-js','jsdom']) require('./release-package/node_modules/' + p + '/package.json'); console.log('packaged deps OK')"

      - name: Smoke-test packaged tree
        # Boot the exact tree that ships (orchestrator, like run.sh/run.bat).
        run: |
          cd release-package
          node orchestrator.js prod & echo $! > orchestrator.pid
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break || sleep 3; done
          curl -sf http://localhost:3000/api/health
          curl -sf "http://localhost:3000/api/music/audio" -o /dev/null -w "music audio handler: %{http_code}\n" || true
          echo ""
          kill "$(cat orchestrator.pid)" || true

      - name: Zip Release Archive
        run: |
          cd release-package
          zip -r ../dango-test.zip .

      - name: Zip Companion Extension
        run: |
          cd dango-extension
          zip -r ../dango-extension-test.zip firefox chrome

      - name: Upload Test Zips
        uses: actions/upload-artifact@v4
        with:
          name: dango-test
          path: |
            dango-test.zip
            dango-extension-test.zip
          retention-days: 7
