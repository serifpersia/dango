name: Build and Release Latest

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        run: |
          # Fetch all remote tags to ensure the local index knows about them
          git fetch --tags origin || true

          # Find previous SHA of refs/tags/latest
          PREV_SHA=$(git rev-parse refs/tags/latest 2>/dev/null || echo "")
          echo "Previous release SHA: $PREV_SHA"

          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Current build SHA: $CURRENT_SHA"

          # Write header
          echo "Automatically built from the latest commit." > release_notes.md
          echo "" >> release_notes.md
          echo "### What's Changed" >> release_notes.md

          if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "$CURRENT_SHA" ]; then
            git log "$PREV_SHA..HEAD" --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges >> release_notes.md
          else
            echo "* Initial release or no new commits since last build." >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Manual Setup" >> release_notes.md
          echo "1. Download and extract 'dango.zip'" >> release_notes.md
          echo "2. Install Node.js 22.12 or newer ('node --version' to check)" >> release_notes.md
          echo "3. No install needed — production dependencies are included, client is prebuilt" >> release_notes.md
          echo "4. Launch using 'run.bat' (Windows) or 'run.sh' (Linux/Mac)" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Android APK" >> release_notes.md
          echo "Universal APK is included in this release if available." >> release_notes.md

      - name: Inject Version Date
        run: |
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.versionDate = new Date().toISOString(); fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"

      - name: Download Existing APK
        # The APK is built elsewhere and carried over between releases.
        # Downloaded BEFORE the build so a build failure never loses it:
        # the old 'latest' release is only replaced after all new artifacts exist.
        run: |
          mkdir -p apk-download
          gh release download "latest" --pattern "*.apk" --dir apk-download/ 2>/dev/null || echo "No existing APK found."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development

      - name: Generate Shipped Defaults
        run: node server/scripts/generate-shipped-defaults.cjs
        env:
          G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          GOOGLE_AUTH_WORKER_URL: ${{ secrets.GOOGLE_AUTH_WORKER_URL }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_ROLES_WORKER_URL: ${{ secrets.DISCORD_ROLES_WORKER_URL }}

      - name: Build Application
        # Direct exec calls: `pnpm run build` triggers pnpm's
        # verify-deps-before-run, which re-prunes devDependencies in this
        # runner env (vite/tsc vanish). exec runs the binaries as-is.
        run: |
          pnpm --filter dango-client exec tsc
          pnpm --filter dango-client exec vite build
          pnpm --filter dango-server exec tsc
        env:
          VITE_TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
          VITE_ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}

      - name: Verify build artifacts
        # Fail fast if dist doesn't match src before it ships.
        run: |
          test -f client/dist/index.html || (echo "missing client/dist/index.html" && exit 1)
          test -f server/dist/server.js || (echo "missing server/dist/server.js" && exit 1)
          test -f server/dist/shipped-defaults.js || (echo "missing shipped defaults" && exit 1)
          grep -q "dango-providers" server/dist/shipped-defaults.js || (echo "shipped defaults missing provider URL" && exit 1)
          node --input-type=module -e "await import('./server/dist/shipped-defaults.js'); await import('./server/dist/config.js'); console.log('server entry imports OK')"

      - name: Create Release Archive
        run: |
          mkdir -p release-package/client
          mkdir -p release-package/server
          cp -r client/dist release-package/client/
          cp -r server/dist release-package/server/
          cp client/package.json release-package/client/
          cp server/package.json release-package/server/
          cp package.json LICENSE README.md release-package/
          cp orchestrator.js release-package/

          echo "#!/bin/bash" > release-package/run.sh
          echo "node orchestrator.js prod" >> release-package/run.sh

          echo "@echo off" > release-package/run.bat
          echo "node orchestrator.js prod" >> release-package/run.bat

          chmod +x release-package/run.sh

      - name: Install packaged dependencies
        # Pinned flat tree: pnpm resolves from pnpm-lock (unlike bare npm
        # install, which re-resolves latest-minor with no lockfile) and
        # node-linker=hoisted lays it out flat with zero symlinks, so the
        # zip extracts cleanly on Windows. .bin/.pnpm are install metadata,
        # unneeded at runtime.
        run: |
          pnpm install --prod --frozen-lockfile --config.node-linker=hoisted --modules-dir "$GITHUB_WORKSPACE/release-package/node_modules"
          rm -rf release-package/node_modules/.bin release-package/node_modules/.pnpm
          node -e "for (const p of ['express','youtubei.js','fflate','cheerio','got-scraping']) require('./release-package/node_modules/' + p + '/package.json'); console.log('packaged deps OK')"

      - name: Zip Release Archive
        run: |
          cd release-package
          zip -r ../dango.zip .

      - name: Zip Companion Extension
        run: |
          cd dango-extension
          zip -r ../dango-extension.zip firefox chrome

      - name: Delete Existing Latest Release
        # Destructive steps run ONLY after the build + packaging succeeded,
        # so a failed build leaves the previous release (and APK) untouched.
        run: |
          gh release delete "latest" --yes || echo "No previous 'latest' release to delete."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Existing Latest Tag
        run: |
          git tag -d "latest" || echo "No local 'latest' tag to delete."
          git push origin --delete "latest" || echo "No remote 'latest' tag to delete."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create New Latest Tag
        run: |
          git tag latest
          git push origin latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create New Latest Release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK_ARG=""
          if ls apk-download/*.apk 1>/dev/null 2>&1; then
            APK_FILE=$(ls apk-download/*.apk | head -1)
            APK_ARG="$APK_FILE"
          fi
          gh release create "latest" \
            "dango.zip" \
            "dango-extension.zip" \
            $APK_ARG \
            --title "latest (v$VERSION)" \
            --notes-file release_notes.md \
            --target ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to NPM
        # --ignore-scripts: prepublishOnly would rebuild via `pnpm run build`,
        # hitting the same verify-deps prune. dist is already fresh from Build.
        run: npm publish --access public --ignore-scripts
        env:
          VITE_TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
          VITE_ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
